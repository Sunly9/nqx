# ============================================================================
# 纽启新生 (NQX) — 一键启动
# ----------------------------------------------------------------------------
# 使用：
#     cp .env.example .env      # 按需修改密码
#     docker compose up -d
#     docker compose logs -f app
#
# 首次启动顺序由 healthcheck 保证：MySQL/Redis 健康后 app 才会启动，
# 避免应用先起来、连不上数据库而启动失败。
# ============================================================================

services:

  # --------------------------------------------------------------------------
  # MySQL 8.0
  # --------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: nqx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      # 容器首次启动时自动建库。表结构仍由应用侧的 Flyway 负责，
      # 这样 DDL 依然有版本记录，不会绕开迁移体系
      MYSQL_DATABASE: nqx
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      # 开启慢查询日志，便于演示索引优化前后的差异
      - --slow-query-log=1
      - --long-query-time=1
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      # 注意 mysqladmin ping 在密码错误时也可能返回成功，
      # 因此这里额外用 -p 确保是真正能连上
      test: [ "CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # --------------------------------------------------------------------------
  # Redis 7
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nqx-redis
    restart: unless-stopped
    # appendonly 开启 AOF 持久化：缓存本身丢了可以重建，
    # 但 Sa-Token 的登录会话也存在这里，重启后用户集体掉线体验很差
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-123456}
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      # 内存达到上限时淘汰最近最少使用的 Key。
      # 注意不能配 allkeys-lru 之外会误删会话的策略，
      # 这里用 volatile-lru（只淘汰设置了过期时间的 Key）更安全
      - --maxmemory-policy
      - volatile-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    # ------------------------------------------------------------------------
    # 这个 environment 是给 healthcheck 用的，不是给 redis-server 用的。
    #
    # 踩过的坑：healthcheck 里写的是 `redis-cli -a $$REDIS_PASSWORD`，
    # `$$` 在 compose 里表示"保留成字面 $，交给容器内的 shell 展开"，
    # 也就是读**容器内的环境变量** REDIS_PASSWORD。
    # 但 compose 从来没给这个容器设置过该变量（`command` 里的 ${REDIS_PASSWORD}
    # 是 compose 在解析阶段就替换掉的，不会进入容器环境）。
    # 结果：`redis-cli -a ""` → AUTH failed: WRONGPASS → 健康检查永远不通过
    # → app 因 depends_on: service_healthy 一直不启动。
    #
    # 之所以很久没发现，是因为这个 compose 文件之前没有真正跑起来过。
    # ------------------------------------------------------------------------
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
    volumes:
      - redis-data:/data
    healthcheck:
      # --no-auth-warning：否则每次检查都往日志里打一行"用 -a 传密码不安全"
      test: [ "CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep PONG" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  # --------------------------------------------------------------------------
  # 后端应用
  # --------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: nqx-backend:1.0.0
    container_name: nqx-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 默认用 prod。本地演示若没有真实微信凭证，可在 .env 里设为 dev：
      # dev 会开启 nqx.wechat.mock-enabled，无需微信授权即可登录。
      # 数据源与 Redis 的地址仍由下面的 DB_HOST / REDIS_HOST 覆盖为容器名，
      # 所以 dev 配置在容器内同样能连对库（application-dev.yml 里的默认值只是 localhost）。
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: nqx
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-123456}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-123456}
      REDIS_DATABASE: ${REDIS_DATABASE:-0}
      # 生产配置默认要求 TLS 连接数据库（application-prod.yml 里 useSSL=true）。
      # 官方 mysql:8.0 镜像首次初始化时会自动生成自签证书，因此默认值可以直接连上；
      # 若换用不提供 SSL 的 MySQL（或中间有代理剥离了 TLS），
      # 在 .env 里设 DB_USE_SSL=false 即可，不必改代码。
      DB_USE_SSL: ${DB_USE_SSL:-true}
      # ⚠️ 微信凭证必须传入。
      #
      # 这两个变量在 .env.example 里已经列出，但最初漏了往容器里传 ——
      # 后果是：prod 环境下 nqx.wechat.mock-enabled 默认为 false，
      # 而 AppID/AppSecret 为空，WeChatApiClient 会**直接拒绝所有登录**
      # （见其注释：「未配置 AppID/AppSecret 且开关关闭时，直接拒绝登录而不是放行」）。
      # 也就是说整个小程序端在 Docker 部署下完全无法登录，
      # 而现象只是"登录失败"，不看日志很难联想到是环境变量没传。
      #
      # 这个默认拒绝的设计本身是对的（忘配参数时应当登不进去，
      # 而不是人人可登录），但它要求部署方必须把变量配到位。
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      WX_ORDER_TEMPLATE_ID: ${WX_ORDER_TEMPLATE_ID:-}
      # ------------------------------------------------------------------
      # 文件存储
      #
      # 默认 cos：容器磁盘是临时的，本地存 = 重启丢图且不报错。
      # 本文件下面给 uploads 挂了 upload-data 卷，所以自建场景也可以用
      # UPLOAD_TYPE=local —— 但那是**单机**才成立（多实例时各实例磁盘互相不可见）。
      #
      # 用 cos 时必须把下面四个变量配齐，否则应用**启动即失败**
      # （这是刻意的：配置错误要在最早的时刻暴露，而不是等用户传头像时才发现）。
      # ------------------------------------------------------------------
      UPLOAD_TYPE: ${UPLOAD_TYPE:-cos}
      COS_SECRET_ID: ${COS_SECRET_ID:-}
      COS_SECRET_KEY: ${COS_SECRET_KEY:-}
      COS_REGION: ${COS_REGION:-ap-shanghai}
      COS_BUCKET: ${COS_BUCKET:-}
      COS_KEY_PREFIX: ${COS_KEY_PREFIX:-uploads}
      COS_DOMAIN: ${COS_DOMAIN:-}
      # 生产配置默认关闭接口文档，但演示环境把它打开，方便直接查看
      SPRINGDOC_ENABLED: ${SPRINGDOC_ENABLED:-true}
      INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:-admin}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-Admin@123}
      TZ: Asia/Shanghai
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # 上传文件与日志挂载到宿主机，容器重建后数据不丢
      - upload-data:/app/uploads
      - app-logs:/app/logs
    # 内存上限：让 JVM 的 MaxRAMPercentage 有明确的参照值
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  mysql-data:
  redis-data:
  upload-data:
  app-logs:
